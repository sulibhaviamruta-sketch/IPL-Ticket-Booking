<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking 2026</title>

    <link rel="stylesheet" href="../CSS/styles.css">
</head>

<body>

    <!-- Navigation Bar -->

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#matches">Matches</a>
        <a href="booking.html">Book Ticket</a>
        <a href="index.html#my-bookings">My Bookings</a>
        <a href="index.html#guidelines">Guidelines</a>
    </nav>

    <!-- Page Heading -->

    <section id="booking">
        <h1>IPL Ticket Booking 2026</h1>
        <h2>Book Your Tickets</h2>

        <p>Fill in the details below to book your IPL tickets.</p>

        <!-- Booking Form -->

        <form action="#" method="get">

            <label for="name">Full Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                minlength="3"
                maxlength="50"
                required
            >

            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10 digit phone number"
                pattern="[0-9]{10}"
                title="Please enter a 10 digit phone number"
                required
            >

            <label for="match">Select Match:</label>
            <select id="match" name="match" required>
                <option value="">-- Select a Match --</option>
                <option value="rcb-vs-csk">RCB vs CSK</option>
                <option value="mi-vs-kkr">MI vs KKR</option>
                <option value="csk-vs-srh">CSK vs SRH</option>
                <option value="rr-vs-rcb">RR vs RCB</option>
            </select>

            <label for="stand">Stand Category:</label>
            <select id="stand" name="stand" required>
                <option value="">-- Select Stand --</option>
                <option value="general">General</option>
                <option value="premium">Premium</option>
                <option value="vip">VIP</option>
            </select>

            <label for="tickets">Number of Tickets:</label>
            <input
                type="number"
                id="tickets"
                name="tickets"
                min="1"
                max="10"
                required
            >

            <!-- Additional Preference -->

            <p><strong>Booking Preference:</strong></p>

            <input
                type="radio"
                id="online"
                name="preference"
                value="online"
                required
            >
            <label for="online">Online Payment</label>

            <input
                type="radio"
                id="counter"
                name="preference"
                value="counter"
            >
            <label for="counter">Counter Collection</label>

            <!-- Buttons -->

            <br><br>

            <button type="submit">Submit Booking</button>

            <button type="reset">Reset Form</button>

        </form>

    </section>

    <!-- Footer -->

    <footer>
        <p>© 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

</body>
</html>
